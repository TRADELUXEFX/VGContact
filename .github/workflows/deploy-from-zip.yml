name: Deploy from uploaded zip

# How to use this from your phone:
#   1. Go to your repo on github.com (mobile browser works fine).
#   2. Tap "Add file" -> "Upload files".
#   3. Upload a zip named exactly "deploy.zip" into the folder "incoming/"
#      (create the folder by typing "incoming/deploy.zip" as the file name
#      in the upload box if it doesn't exist yet).
#   4. Commit directly to main.
#   5. This workflow runs automatically, extracts deploy.zip into the repo
#      root (overwriting matching paths), deletes deploy.zip, and commits
#      the result. Your normal build workflow then runs on that commit.
#
# The zip should be structured so its internal paths match where files
# belong in the repo, e.g. zip containing:
#   app/src/main/res/layout/activity_repost.xml
#   app/src/main/java/com/vgcontact/app/RepostActivity.kt
# will land in exactly those paths.

on:
  push:
    paths:
      - "incoming/deploy.zip"

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract deploy.zip into repo root
        run: |
          set -e
          unzip -o incoming/deploy.zip -d .
          rm -f incoming/deploy.zip

      - name: Commit unpacked files
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Deploy: unpack incoming/deploy.zip"
            git push
          fi
