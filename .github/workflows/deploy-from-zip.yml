name: Deploy from uploaded zip

# How to use this from your phone:
#   1. Go to your repo on github.com (mobile browser works fine).
#   2. Navigate into the "incoming" folder.
#   3. Tap "Add file" -> "Upload files".
#   4. Upload ANY zip file, any name (deploy.zip, update1.zip, whatever).
#   5. Commit directly to main.
#   6. This workflow runs automatically: it finds every .zip file sitting
#      in incoming/, extracts each one into the repo root (overwriting
#      matching paths), deletes the zip(s) it just processed, commits the
#      result, AND builds the APK in this same run.
#
# Why the build happens here instead of relying on build.yml to fire
# afterwards: this workflow's commit is pushed using the built-in
# GITHUB_TOKEN, and GitHub deliberately does not let that token's pushes
# trigger other push-based workflows (an anti-infinite-loop rule). That
# meant build.yml never re-ran after a deploy commit. Doing the build
# directly in this job removes that dependency entirely.

on:
  push:
    paths:
      - "incoming/*.zip"

permissions:
  contents: write

jobs:
  unpack-commit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract every zip found in incoming/ into repo root
        id: extract
        run: |
          set -e
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in incoming/. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          for z in "${zips[@]}"; do
            echo "Extracting $z ..."
            unzip -o "$z" -d .
            rm -f "$z"
          done

      - name: Commit unpacked files
        if: steps.extract.outputs.found == 'true'
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Deploy: unpack zip(s) from incoming/"
            git push
          fi

      - name: Set up JDK
        if: steps.extract.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.extract.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        if: steps.extract.outputs.found == 'true'
        run: gradle assembleDebug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        if: steps.extract.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Releases
        if: steps.extract.outputs.found == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
