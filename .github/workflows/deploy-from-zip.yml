name: Deploy from uploaded zip

# How to use this from your phone:
#   1. Go to your repo on github.com (mobile browser works fine).
#   2. Navigate into the "incoming" folder.
#   3. Tap "Add file" -> "Upload files".
#   4. Upload ANY zip file, any name (deploy.zip, update1.zip, whatever).
#   5. Commit directly to main.
#   6. This workflow runs automatically: it finds every .zip file sitting
#      in incoming/, extracts each one into the repo root (overwriting
#      matching paths), deletes all the zip(s) it just processed, and
#      commits the result. Your normal build workflow then runs on that
#      commit.
#
# You never need to worry about the exact filename, and you never need
# to manually delete the zip afterwards - this workflow does both for
# you automatically, every time.
#
# The zip should be structured so its internal paths match where files
# belong in the repo, e.g. zip containing:
#   app/src/main/res/layout/activity_repost.xml
#   app/src/main/java/com/vgcontact/app/RepostActivity.kt
# will land in exactly those paths.

on:
  push:
    paths:
      - "incoming/*.zip"

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract every zip found in incoming/ into repo root
        run: |
          set -e
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in incoming/. Nothing to do."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "Extracting $z ..."
            unzip -o "$z" -d .
            rm -f "$z"
          done

      - name: Commit unpacked files
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Deploy: unpack zip(s) from incoming/"
            git push
          fi
