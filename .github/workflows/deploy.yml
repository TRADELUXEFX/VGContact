name: Deploy

# How to use this from your phone:
#   1. Go to your repo on github.com (mobile browser works fine).
#   2. Navigate into the "incoming" folder.
#   3. Tap "Add file" -> "Upload files".
#   4. Upload ANY zip file, any name (deploy.zip, update1.zip, whatever).
#   5. Commit directly to main.
#   6. This workflow runs: if there's a zip in incoming/, it extracts it,
#      commits the result, and deletes the zip. Either way (zip or plain
#      code push) it then builds the APK from whatever is currently in
#      the repo and publishes a release.
#
# This replaces the old two-workflow setup (build.yml + deploy-from-zip.yml)
# with a single workflow so there's only ever one build per push, whether
# that push is a zip upload or a normal commit.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  # Needed so the deploy-bot commit can push changes under
  # .github/workflows/ too. Without this, GitHub silently rejects
  # that specific push, and the fallback step below reverts to the
  # old code and builds/releases that instead - with no visible error.
  workflows: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract any zip(s) found in incoming/ into repo root
        id: extract
        run: |
          set -e
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip files found in incoming/. Nothing to unpack."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          for z in "${zips[@]}"; do
            echo "Extracting $z (excluding .github/workflows/ - GitHub blocks the default token from modifying that folder, so any workflow files inside the zip are skipped rather than causing the whole deploy to fail) ..."
            unzip -o "$z" -x ".github/workflows/*" -d .
            rm -f "$z"
          done

      - name: Commit unpacked files
        if: steps.extract.outputs.found == 'true'
        id: commit_unpacked
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"

          # Guard against zips that contain a wrapper folder (e.g.
          # "VGContact-main/app/..." instead of "app/..."). Extracting
          # those creates a stray extra folder alongside the real app/
          # folder - git sees "a change" and commits/pushes fine, but
          # the actual app/build.gradle and app/src files are never
          # touched, so the build silently uses the OLD code while
          # still reporting success. Fail loudly instead of guessing.
          if [ -d "app" ] && [ "$(find . -maxdepth 2 -name build.gradle -path './*/app/build.gradle' | wc -l)" -gt 0 ]; then
            echo "::error::The uploaded zip appears to contain a wrapper folder (its app/ folder is nested one level too deep). This would silently leave the real app/ untouched. Please zip the CONTENTS of the project (build.gradle, app/, .github/ at the top level), not the project folder itself."
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "::error::Nothing changed after extracting the zip - your new code did not actually replace any existing files. Stopping instead of building the old app."
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Require that app/build.gradle itself is part of the diff,
          # since that's the file whose version bump proves this is a
          # real update and not a no-op extraction.
          if ! git diff --cached --name-only | grep -q '^app/build.gradle$'; then
            echo "::error::app/build.gradle was not part of the changes from this zip. Refusing to build, since this usually means the zip extracted to the wrong location and the real app code was never updated."
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Deploy: unpack zip(s) from incoming/"
          if git push; then
            echo "Push succeeded."
          else
            echo "::error::Push of unpacked files was rejected (see log above)."
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
          fi

      # If the push above failed (e.g. GitHub rejected a change under
      # .github/workflows/ because this App lacks the `workflows`
      # permission), the zip deletion from the extract step never made it
      # to main - the zip is still sitting in incoming/ on the remote.
      # This step removes just the zip(s) on their own, leaving every
      # other unpacked file exactly as it was in the failed commit (still
      # only local to this failed run, untouched on main) so the next
      # upload isn't blocked by a leftover zip.
      - name: Ensure the zip is removed even if the full push failed
        if: steps.extract.outputs.found == 'true' && steps.commit_unpacked.outputs.push_failed == 'true'
        run: |
          set -e
          git fetch origin main
          git checkout origin/main -- .
          shopt -s nullglob
          zips=(incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip left on main - nothing to clean up."
            exit 0
          fi
          git rm -f "${zips[@]}"
          git commit -m "Deploy: remove zip(s) from incoming/ after failed deploy"
          git push origin HEAD:main

      # If the push of your new code was rejected, everything after this
      # point would otherwise silently build and release the OLD code
      # still on main, with no visible error. Stop here instead so a
      # failed deploy shows up as a failed run, not a fake success.
      - name: Stop here if the new code never made it to main
        if: steps.commit_unpacked.outputs.push_failed == 'true'
        run: |
          echo "::error::Your uploaded zip could not be pushed to main, so the build was stopped instead of releasing the old, unchanged code. Check the 'Commit unpacked files' step log above."
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: gradle assembleDebug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
